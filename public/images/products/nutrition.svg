<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Nutrition jar illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309" />
      <stop offset="1" stop-color="#4a2a0d" />
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".5" />
      <stop offset="1" stop-color="#fde68a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#291603" flood-opacity=".5" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="140" cy="160" r="160" fill="url(#blob)" filter="url(#soft)" />
  <circle cx="460" cy="430" r="150" fill="url(#blob)" filter="url(#soft)" opacity=".7" />
  <rect x="110" y="80" width="380" height="440" rx="40" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)" />
  <path d="M150 126h300" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" />
  <g filter="url(#shadow)">
    <rect x="230" y="176" width="140" height="36" rx="12" fill="#ffffff" fill-opacity=".5" />
    <rect x="238" y="204" width="124" height="188" rx="26" fill="url(#bottle)" stroke="#ffffff" stroke-opacity=".5" />
    <rect x="238" y="266" width="124" height="80" rx="8" fill="#fcd34d" fill-opacity=".4" />
    <path d="M300 296c0-16 18-26 34-20 4 16-8 30-34 30" fill="#ffffff" fill-opacity=".72" />
    <rect x="254" y="226" width="10" height="132" rx="5" fill="#ffffff" fill-opacity=".33" />
  </g>
  <text x="300" y="482" fill="#ffffff" fill-opacity=".72" font-family="sans-serif" font-size="18" letter-spacing="4" text-anchor="middle">SAVELIFE</text>
</svg>
