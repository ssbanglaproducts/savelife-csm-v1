<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Home fragrance illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5bd0" />
      <stop offset="1" stop-color="#2c245c" />
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ddd6fe" stop-opacity=".5" />
      <stop offset="1" stop-color="#ddd6fe" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#100c2e" flood-opacity=".5" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="140" cy="150" r="160" fill="url(#blob)" filter="url(#soft)" />
  <circle cx="470" cy="430" r="150" fill="url(#blob)" filter="url(#soft)" opacity=".7" />
  <rect x="110" y="80" width="380" height="440" rx="40" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)" />
  <path d="M150 126h300" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" />
  <g filter="url(#shadow)">
    <path d="M280 234l-20-72M298 232l-2-82M316 234l20-72" stroke="#fde68a" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85" />
    <circle cx="259" cy="158" r="5" fill="#ffffff" fill-opacity=".7" />
    <circle cx="296" cy="146" r="5" fill="#ffffff" fill-opacity=".7" />
    <circle cx="337" cy="158" r="5" fill="#ffffff" fill-opacity=".7" />
    <rect x="262" y="266" width="76" height="116" rx="18" fill="url(#bottle)" stroke="#ffffff" stroke-opacity=".5" />
    <rect x="286" y="232" width="28" height="38" rx="7" fill="#ffffff" fill-opacity=".4" />
    <rect x="272" y="316" width="56" height="40" rx="8" fill="#c7d2fe" fill-opacity=".4" />
  </g>
  <text x="300" y="482" fill="#ffffff" fill-opacity=".72" font-family="sans-serif" font-size="18" letter-spacing="4" text-anchor="middle">SAVELIFE</text>
</svg>
