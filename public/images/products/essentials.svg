<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Daily essentials illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490" />
      <stop offset="1" stop-color="#0c3a4a" />
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity=".5" />
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#001a26" flood-opacity=".45" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="460" cy="160" r="160" fill="url(#blob)" filter="url(#soft)" />
  <circle cx="150" cy="440" r="150" fill="url(#blob)" filter="url(#soft)" opacity=".7" />
  <rect x="110" y="80" width="380" height="440" rx="40" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)" />
  <path d="M150 126h300" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" />
  <g filter="url(#shadow)">
    <circle cx="372" cy="206" r="22" fill="#ffffff" fill-opacity=".2" stroke="#ffffff" stroke-opacity=".42" />
    <circle cx="404" cy="172" r="12" fill="#ffffff" fill-opacity=".18" />
    <rect x="202" y="254" width="196" height="118" rx="36" fill="url(#bottle)" stroke="#ffffff" stroke-opacity=".5" />
    <path d="M240 292h120" stroke="#ffffff" stroke-opacity=".45" stroke-width="12" stroke-linecap="round" />
    <path d="M244 326h84" stroke="#ffffff" stroke-opacity=".28" stroke-width="8" stroke-linecap="round" />
  </g>
  <text x="300" y="482" fill="#ffffff" fill-opacity=".72" font-family="sans-serif" font-size="18" letter-spacing="4" text-anchor="middle">SAVELIFE</text>
</svg>
