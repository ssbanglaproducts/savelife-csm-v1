<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Wellness supplement bottle illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="1" stop-color="#0b3b38" />
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".55" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#001b18" flood-opacity=".45" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="140" cy="150" r="150" fill="url(#blob)" filter="url(#soft)" />
  <circle cx="470" cy="430" r="170" fill="url(#blob)" filter="url(#soft)" opacity=".7" />
  <rect x="110" y="80" width="380" height="440" rx="40" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)" />
  <path d="M150 126h300" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" />
  <g filter="url(#shadow)">
    <rect x="262" y="188" width="76" height="28" rx="9" fill="#d7fbef" fill-opacity=".85" />
    <rect x="252" y="212" width="96" height="180" rx="26" fill="url(#bottle)" stroke="#ffffff" stroke-opacity=".5" />
    <rect x="252" y="270" width="96" height="84" rx="10" fill="#f8d9a0" fill-opacity=".5" />
    <path d="M300 306c12-22 32-26 44-20-2 18-16 30-34 30" fill="#2dd4a7" fill-opacity=".85" />
    <rect x="270" y="232" width="10" height="122" rx="5" fill="#ffffff" fill-opacity=".35" />
  </g>
  <text x="300" y="482" fill="#ffffff" fill-opacity=".72" font-family="sans-serif" font-size="18" letter-spacing="4" text-anchor="middle">SAVELIFE</text>
</svg>
