<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Skincare serum illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333ea" />
      <stop offset="1" stop-color="#3b1d5c" />
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity=".5" />
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1d0b33" flood-opacity=".48" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="450" cy="160" r="155" fill="url(#blob)" filter="url(#soft)" />
  <circle cx="150" cy="430" r="155" fill="url(#blob)" filter="url(#soft)" opacity=".7" />
  <rect x="110" y="80" width="380" height="440" rx="40" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)" />
  <path d="M150 126h300" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" />
  <g filter="url(#shadow)">
    <path d="M300 182v-42" stroke="#ffffff" stroke-opacity=".7" stroke-width="12" stroke-linecap="round" />
    <circle cx="300" cy="136" r="16" fill="#ffffff" fill-opacity=".68" />
    <rect x="272" y="182" width="56" height="56" rx="10" fill="#ffffff" fill-opacity=".5" />
    <rect x="266" y="236" width="68" height="154" rx="22" fill="url(#bottle)" stroke="#ffffff" stroke-opacity=".55" />
    <rect x="274" y="294" width="52" height="52" rx="8" fill="#f9a8d4" fill-opacity=".42" />
    <rect x="280" y="256" width="8" height="98" rx="4" fill="#ffffff" fill-opacity=".33" />
  </g>
  <text x="300" y="482" fill="#ffffff" fill-opacity=".72" font-family="sans-serif" font-size="18" letter-spacing="4" text-anchor="middle">SAVELIFE</text>
</svg>
