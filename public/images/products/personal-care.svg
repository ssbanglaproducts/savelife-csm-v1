<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Personal care bottle illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be185d" />
      <stop offset="1" stop-color="#5c1d3b" />
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fbcfe8" stop-opacity=".48" />
      <stop offset="1" stop-color="#fbcfe8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2b0a1c" flood-opacity=".45" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="450" cy="160" r="160" fill="url(#blob)" filter="url(#soft)" />
  <circle cx="150" cy="430" r="150" fill="url(#blob)" filter="url(#soft)" opacity=".65" />
  <rect x="110" y="80" width="380" height="440" rx="40" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)" />
  <path d="M150 126h300" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" />
  <g filter="url(#shadow)">
    <path d="M282 178v-18h58" stroke="#ffffff" stroke-opacity=".6" stroke-width="10" stroke-linecap="round" fill="none" />
    <rect x="276" y="176" width="48" height="42" rx="8" fill="#ffffff" fill-opacity=".42" />
    <rect x="252" y="214" width="96" height="178" rx="24" fill="url(#bottle)" stroke="#ffffff" stroke-opacity=".5" />
    <rect x="268" y="272" width="64" height="62" rx="10" fill="#fbcfe8" fill-opacity=".45" />
    <rect x="270" y="234" width="10" height="124" rx="5" fill="#ffffff" fill-opacity=".33" />
  </g>
  <text x="300" y="482" fill="#ffffff" fill-opacity=".72" font-family="sans-serif" font-size="18" letter-spacing="4" text-anchor="middle">SAVELIFE</text>
</svg>
