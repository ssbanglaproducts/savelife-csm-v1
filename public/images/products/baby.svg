<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Baby care illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7" />
      <stop offset="1" stop-color="#123c5c" />
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bae6fd" stop-opacity=".52" />
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#062338" flood-opacity=".45" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="150" cy="150" r="155" fill="url(#blob)" filter="url(#soft)" />
  <circle cx="460" cy="420" r="155" fill="url(#blob)" filter="url(#soft)" opacity=".7" />
  <rect x="110" y="80" width="380" height="440" rx="40" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)" />
  <path d="M150 126h300" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" />
  <g filter="url(#shadow)">
    <path d="M280 180c-8-20 4-34 20-34s28 14 20 34z" fill="#fbcfe8" fill-opacity=".8" />
    <rect x="266" y="214" width="68" height="30" rx="10" fill="#ffffff" fill-opacity=".5" />
    <path d="M268 244h64l10 148c1 14-10 26-24 26h-36c-14 0-25-12-24-26z" fill="url(#bottle)" stroke="#ffffff" stroke-opacity=".5" />
    <rect x="274" y="304" width="52" height="54" rx="10" fill="#e0f2fe" fill-opacity=".45" />
    <rect x="282" y="258" width="8" height="118" rx="4" fill="#ffffff" fill-opacity=".33" />
  </g>
  <text x="300" y="482" fill="#ffffff" fill-opacity=".72" font-family="sans-serif" font-size="18" letter-spacing="4" text-anchor="middle">SAVELIFE</text>
</svg>
