<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Fitness shaker illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca" />
      <stop offset="1" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity=".5" />
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06" />
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72" />
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0d0a2b" flood-opacity=".5" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="140" cy="160" r="155" fill="url(#blob)" filter="url(#soft)" />
  <circle cx="460" cy="420" r="155" fill="url(#blob)" filter="url(#soft)" opacity=".7" />
  <rect x="110" y="80" width="380" height="440" rx="40" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)" />
  <path d="M150 126h300" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" />
  <g filter="url(#shadow)">
    <rect x="256" y="186" width="88" height="32" rx="12" fill="#ffffff" fill-opacity=".55" />
    <path d="M262 216h76l-8 170c-1 12-11 21-23 21h-14c-12 0-22-9-23-21z" fill="url(#bottle)" stroke="#ffffff" stroke-opacity=".5" />
    <rect x="270" y="270" width="60" height="64" rx="10" fill="#a5b4fc" fill-opacity=".45" />
    <path d="M286 300l10 10 20-22" stroke="#ffffff" stroke-opacity=".82" stroke-width="6" stroke-linecap="round" fill="none" />
    <rect x="278" y="236" width="8" height="136" rx="4" fill="#ffffff" fill-opacity=".33" />
  </g>
  <text x="300" y="482" fill="#ffffff" fill-opacity=".72" font-family="sans-serif" font-size="18" letter-spacing="4" text-anchor="middle">SAVELIFE</text>
</svg>
